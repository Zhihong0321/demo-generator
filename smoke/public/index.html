<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Smoke App</title>
<style>
  :root {
    --bg: #0f1113; --card: #17191d; --line: #262a30;
    --ink: #e9e7e3; --dim: #8b8f96; --gold: #e8b339; --green: #6fbf73;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 18px 20px 14px; border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
  .sub { margin: 3px 0 0; color: var(--dim); font-size: 12.5px; }
  main { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px;
  }
  .label { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .value { font-size: 30px; font-weight: 650; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .value.good { color: var(--green); }
  button {
    width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--gold); color: #1a1408; font: inherit; font-weight: 650;
    cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--ink); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  footer { padding: 14px 20px 22px; color: var(--dim); font-size: 12px; }
  .pill {
    display: inline-block; padding: 3px 9px; border-radius: 99px;
    border: 1px solid var(--line); font-size: 11px; color: var(--dim);
  }
</style>
</head>
<body>
  <header>
    <h1 data-testid="app-title">Smoke App</h1>
    <p class="sub">A fake screen, used to prove the render pipeline works.</p>
  </header>

  <main>
    <div class="card">
      <div class="label">Monthly saving</div>
      <div class="value good" data-testid="saving">RM 0</div>
    </div>

    <div class="card">
      <div class="label">System size</div>
      <div class="value" data-testid="size">0.0 kWp</div>
    </div>

    <div class="row">
      <button data-testid="calculate">Calculate</button>
      <button class="ghost" data-testid="reset">Reset</button>
    </div>
  </main>

  <footer>
    <span class="pill" data-testid="status">idle</span>
  </footer>

<script>
/*
 * Reference implementation of App Contract #2 — the readiness signal.
 *
 * This is deliberately the smallest thing that satisfies the contract:
 * `window.__demoReady` is true only when nothing is in flight and fonts have
 * loaded. templates/app-contract/demo-mode.js is the production version.
 */
(() => {
  let inFlight = 0;
  let fontsReady = false;
  let timer = null;

  window.__demoReady = false;

  function recompute() {
    clearTimeout(timer);
    if (inFlight > 0 || !fontsReady) { window.__demoReady = false; return; }
    timer = setTimeout(() => {
      if (inFlight === 0 && fontsReady) {
        window.__demoReady = true;
        window.dispatchEvent(new CustomEvent('demo:ready'));
      }
    }, 200);
  }

  // Stand-in for a real data fetch, so the readiness signal has something to do.
  function busy(ms) {
    inFlight++; recompute();
    return new Promise((resolve) => setTimeout(() => {
      inFlight = Math.max(0, inFlight - 1); recompute(); resolve();
    }, ms));
  }

  (document.fonts?.ready ?? Promise.resolve()).then(() => { fontsReady = true; recompute(); });

  const saving = document.querySelector('[data-testid="saving"]');
  const size   = document.querySelector('[data-testid="size"]');
  const status = document.querySelector('[data-testid="status"]');

  document.querySelector('[data-testid="calculate"]').addEventListener('click', async () => {
    status.textContent = 'calculating';
    await busy(600);
    saving.textContent = 'RM 412';
    size.textContent = '6.6 kWp';
    status.textContent = 'done';
  });

  document.querySelector('[data-testid="reset"]').addEventListener('click', async () => {
    status.textContent = 'resetting';
    await busy(300);
    saving.textContent = 'RM 0';
    size.textContent = '0.0 kWp';
    status.textContent = 'idle';
  });

  recompute();
})();
</script>
</body>
</html>
